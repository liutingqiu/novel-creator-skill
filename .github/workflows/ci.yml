name: CI

on:
  push:
    branches: [ main, "feat/**", "tech/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    # 3.9 has no build for ubuntu-latest (26.04); pin it to 22.04 instead.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Test Suites
      run: |
        python -m unittest discover -s scripts -p "test_*.py"
        python -m unittest discover -s scripts/tests -p "test_*.py"
